apiVersion: batch/v1
kind: Job
metadata:
  name: bench-producer
  namespace: celery-perf
  labels:
    app.kubernetes.io/name: bench-producer
    app.kubernetes.io/part-of: celery-perf
    bench/component: producer
spec:
  # Jobs are single-use; a new Job is created per benchmark run by Dagster
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench-producer
        app.kubernetes.io/part-of: celery-perf
        bench/component: producer
    spec:
      restartPolicy: Never
      serviceAccountName: bench-worker
      containers:
        - name: producer
          image: celery-perf/benchlib:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery-perf-run
            - --spec-json
            - /run/spec/run_spec.json
            - --out
            - /results
          envFrom:
            - configMapRef:
                name: bench-config
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: results
              mountPath: /results
            - name: run-spec
              mountPath: /run/spec
              readOnly: true
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: bench-results-pvc
        - name: run-spec
          configMap:
            name: bench-run-spec
