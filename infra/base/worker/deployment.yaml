apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-worker
  namespace: celery-perf
  labels:
    app.kubernetes.io/name: bench-worker
    app.kubernetes.io/part-of: celery-perf
    bench/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bench-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench-worker
        app.kubernetes.io/part-of: celery-perf
        bench/component: worker
    spec:
      serviceAccountName: bench-worker
      containers:
        - name: worker
          # Image is overridden per environment — local dev uses a local tag
          image: celery-perf/benchlib:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - benchlib.workload
            - worker
            - --pool=$(CELERY_POOL)
            - --concurrency=$(CELERY_CONCURRENCY)
            - --loglevel=info
            - --without-gossip
            - --without-mingle
          envFrom:
            - configMapRef:
                name: bench-config
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: bench-results-pvc
